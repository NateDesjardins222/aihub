syntax = "proto2";

// =============================================================================
// ATLAS TEST-DOUBLE SCHEMA — NOT the official Rithmic package.
// =============================================================================
//
// This file reproduces ONLY the subset of R | Protocol message shapes and field
// names that Atlas consumes, so the protocol codec, framing, router and the
// deterministic test suite can be exercised WITHOUT redistributing Rithmic's
// proprietary RProtocolAPI.0.90.0.0 package (see docs/rithmic/rithmic-local-setup.md
// and M9 spec §38).
//
// THE OFFICIAL RITHMIC PACKAGE IS AUTHORITATIVE. When the owner runs
// `pnpm --filter @atlas/server rithmic:generate`, the official `.proto` files in
// vendor/rithmic/proto/ are loaded instead of this file, and the template-id
// registry is derived from THEM. The `template_id` defaults below mirror the
// publicly documented R | Protocol template ids so the doubles are realistic; the
// codec never hardcodes an id — it always derives the id<->message map from the
// loaded schema, so the official package silently overrides any value here.
//
// The template_id field number (154467) is the documented R | Protocol convention;
// it lives in the schema, not in Atlas code.
// =============================================================================

package rti;

// ---- discovery --------------------------------------------------------------
message RequestRithmicSystemInfo {
  required int32 template_id = 154467 [default = 16];
  repeated string user_msg = 132760;
}
message ResponseRithmicSystemInfo {
  required int32 template_id = 154467 [default = 17];
  repeated string rp_code = 132766;
  repeated string system_name = 153642;
  repeated bool has_aggregated_quotes = 154769;
}


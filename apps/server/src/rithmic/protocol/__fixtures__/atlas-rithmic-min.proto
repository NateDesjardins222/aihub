    BBO = 2;
    ORDER_BOOK = 4;
    OPEN = 8;
    OPENING_INDICATOR = 16;
    HIGH_LOW = 32;
    HIGH_BID_LOW_ASK = 64;
    CLOSE = 128;
    CLOSING_INDICATOR = 256;
    SETTLEMENT = 512;
    MARKET_MODE = 1024;
    OPEN_INTEREST = 2048;
  }
  required int32 template_id = 154467 [default = 100];
  repeated string user_msg = 132760;
  optional string symbol = 110100;
  optional string exchange = 110101;
  optional Request request = 100000;
  optional uint32 update_bits = 154021;
}
message ResponseMarketDataUpdate {
  required int32 template_id = 154467 [default = 101];
  repeated string user_msg = 132760;
  repeated string rp_code = 132766;
}

    PNL_PLANT = 4;
    REPOSITORY_PLANT = 5;
  }
  required int32 template_id = 154467 [default = 10];
  optional string template_version = 149290;
  repeated string user_msg = 132760;
  optional string user = 153001;
  optional string password = 110511;
  optional string app_name = 153013;
  optional string app_version = 153014;
  optional string system_name = 153642;
  optional SysInfraType infra_type = 150202;
  repeated string mac_addr = 154014;
  optional string os_version = 153619;
  optional string os_platform = 153620;
  optional string aggregated_quotes = 154766;
}
message ResponseLogin {
  required int32 template_id = 154467 [default = 11];
  repeated string user_msg = 132760;
  repeated string rp_code = 132766;
  optional string fcm_id = 154013;
  optional string ib_id = 154012;

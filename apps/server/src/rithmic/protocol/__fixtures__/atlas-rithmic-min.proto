  optional string symbol = 110100;
  optional string exchange = 110101;
  optional BarType bar_type = 119200;
  optional int32 bar_type_period = 119201;
  optional int32 start_index = 119203;   // epoch seconds
  optional int32 finish_index = 119204;  // epoch seconds
  optional Direction direction = 119100;
